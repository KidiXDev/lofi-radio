name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo_enabled: 0
            ext: zip
            bin: lofi.exe
            asset: lofi-radio_Windows_x86_64.zip
          - runs_on: ubuntu-latest
            goos: windows
            goarch: arm64
            cgo_enabled: 0
            ext: zip
            bin: lofi.exe
            asset: lofi-radio_Windows_arm64.zip
          - runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo_enabled: 1
            ext: tar.gz
            bin: lofi
            asset: lofi-radio_Linux_x86_64.tar.gz
          - runs_on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo_enabled: 1
            ext: tar.gz
            bin: lofi
            asset: lofi-radio_Linux_arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Linux audio build deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build binary
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/kidixdev/lofi-radio/internal/version.Version=${GITHUB_REF_NAME}" -o "dist/${{ matrix.bin }}" .

      - name: Package zip
        if: matrix.ext == 'zip'
        run: |
          cd dist
          zip -9 "${{ matrix.asset }}" "${{ matrix.bin }}"

      - name: Package tar.gz
        if: matrix.ext == 'tar.gz'
        run: |
          cd dist
          tar -czf "${{ matrix.asset }}" "${{ matrix.bin }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
